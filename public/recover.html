<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1117">
    <meta name="robots" content="noindex">
    <title>Recover Pocket Chronicle</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #f4f5f7;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(circle at 50% 0%, rgba(94, 138, 184, 0.18), transparent 42%),
          #0f1117;
      }

      main {
        width: min(100%, 430px);
        padding: 32px 26px;
        border: 1px solid #314157;
        border-radius: 24px;
        background: rgba(20, 24, 33, 0.96);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.32);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border: 1px solid #6685a6;
        border-radius: 20px;
        color: #b8d0e8;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 26px;
        letter-spacing: 0.06em;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #91b4d6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(34px, 10vw, 46px);
        font-weight: 500;
        line-height: 1.05;
      }

      p {
        margin: 18px 0 0;
        color: #aeb7c4;
        font-size: 16px;
        line-height: 1.55;
      }

      button, a {
        width: 100%;
        min-height: 56px;
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #88a9c9;
        border-radius: 18px;
        background: #4e6c8b;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: 0.72; }
      a[hidden] { display: none; }
      #detail { font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">PC</div>
      <p class="eyebrow">Pocket Chronicle recovery</p>
      <h1>Repair this phone</h1>
      <p id="status">Repairing the saved app files on this phone. Your campaign pairing and character information will stay connected.</p>
      <button id="repair" type="button" disabled>Repairing…</button>
      <a id="open" href="/" hidden>Open Pocket Chronicle</a>
      <p id="detail">Open this page in Safari or Chrome, not from the frozen Home Screen icon.</p>
    </main>
    <script>
      const repairButton = document.getElementById("repair");
      const openLink = document.getElementById("open");
      const statusText = document.getElementById("status");
      const detailText = document.getElementById("detail");

      async function repairPocketChronicle() {
        repairButton.disabled = true;
        repairButton.textContent = "Repairing…";
        statusText.textContent = "Clearing the old app files from this phone…";

        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          openLink.href = "/?recovered=" + Date.now();
          repairButton.hidden = true;
          openLink.hidden = false;
          statusText.textContent = "Pocket Chronicle is repaired on this phone.";
          detailText.textContent = "Tap Open Pocket Chronicle. The repair page will not redirect on its own.";
        } catch (error) {
          repairButton.disabled = false;
          repairButton.textContent = "Try again";
          statusText.textContent = "The phone did not finish clearing the old files.";
          detailText.textContent = "Keep this page open in Safari or Chrome and tap Try again.";
        }
      }

      repairButton.addEventListener("click", repairPocketChronicle);
      repairPocketChronicle();
    </script>
  </body>
</html>
