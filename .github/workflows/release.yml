name: Build Pocket Chronicle release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate app
        run: |
          npm ci
          npm run validate

      - name: Package lightweight Foundry bridge
        run: |
          cd foundry/pocket-chronicle-bridge
          zip -r ../../pocket-chronicle-bridge.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pocket-chronicle-bridge.zip
